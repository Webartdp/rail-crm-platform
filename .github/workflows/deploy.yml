name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Check SSH port is reachable
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "runner IP: $(curl -s https://api.ipify.org || echo unknown)"
          echo "DEPLOY_HOST length: ${#DEPLOY_HOST} (77.42.56.171 = 12)"
          if timeout 10 bash -c "</dev/tcp/${DEPLOY_HOST}/22" 2>/dev/null; then
            echo "port 22 reachable via DEPLOY_HOST"
          else
            echo "::error::port 22 NOT reachable via DEPLOY_HOST"
            if timeout 10 bash -c "</dev/tcp/77.42.56.171/22" 2>/dev/null; then
              echo "::error::but 77.42.56.171:22 IS reachable -> DEPLOY_HOST secret value is wrong"
            else
              echo "::error::77.42.56.171:22 is not reachable from GitHub either -> blocked by provider firewall"
            fi
            exit 1
          fi

      # The server key is restricted with a forced command in authorized_keys:
      # it can only run deploy/deploy.sh from origin/main, nothing else.
      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "admin@${DEPLOY_HOST}" deploy
